[package]
name = "cs-stratum-bridge"
version = "0.1.2"
edition = "2021"
description = "Bridge/adapter between stratum-based cs-miner clients and the csd daemon — owns the OPoI (AI-inference mining) protocol, relays PoW mining.* traffic through to the upstream pool unchanged"

[[bin]]
name = "cs-stratum-bridge"
path = "src/main.rs"

[dependencies]
# async
tokio       = { version = "1", features = ["full"] }
futures     = "0.3"

# CLI + config
clap        = { version = "4", features = ["derive", "env"] }
dotenvy     = "0.15"

# serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# HTTP server (prompt intake + status API)
axum        = "0.7"
tower-http  = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (csd JSON-RPC)
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Not used directly — forces the `vendored` feature build-wide via Cargo's
# feature unification. `postgresql_embedded` pulls in `native-tls`/
# `openssl-sys` transitively (its own HTTP client, to download the Postgres
# binary on first run) regardless of this crate's own reqwest/sqlx choosing
# rustls everywhere else, which left the release binary dynamically linked
# against libssl.so.1.1 — a SONAME that doesn't exist on newer distros
# (Ubuntu 22.04+ ships OpenSSL 3.x as libssl.so.3), breaking portability the
# same way an unpinned glibc would (see hive/release.sh in cs-miner for the
# same class of issue). `vendored` compiles+statically links OpenSSL from
# source instead, so the resulting binary carries no runtime openssl
# dependency at all.
openssl     = { version = "0.10", features = ["vendored"] }

# database
sqlx        = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "macros", "migrate"] }
# Embedded Postgres: operators running a bridge/miner shouldn't need to
# install or administer a separate Postgres server themselves — this
# downloads and manages a real Postgres binary as a private subprocess,
# speaking the same wire protocol sqlx already uses, so every existing
# query/migration is untouched. Only used when DATABASE_URL isn't set
# (see config.rs/main.rs); an operator who already runs their own Postgres
# can still point at it directly.
postgresql_embedded = "0.21"

# crypto / encoding
sha2        = "0.10"
hex         = "0.4"
# B3-lite (see opoi/b3lite.rs): HMAC-SHA256 signed receipts — a symmetric,
# operator-shared-secret signature. Deliberately not an asymmetric scheme:
# this receipt is an OFF-CHAIN-ONLY accountability artifact for the
# bridge operator's own sampling/audit/consequence pipeline (see the
# B3-lite scope doc — "no consensus change"), not a publicly-verifiable
# on-chain commitment, so there's no third party needing to verify it
# without sharing the secret, and no existing asymmetric-signing key
# management infrastructure in this codebase to build on instead.
hmac        = "0.12"

# F15-L (speculative_engine.rs): the bridge needs to know the prompt's REAL
# token count (to seed `base`, the KV-cache position speculative rounds are
# tracked relative to) without doing any inference itself — same tokenizer
# crate/version cs-miner already uses, downloading the same tokenizer.json
# ModelSource already has a URL/hash for (see gguf_fetch-style caching in
# opoi/speculative_engine.rs).
tokenizers  = "0.22"

# logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# error handling
anyhow      = "1"
thiserror   = "1"
async-trait = "0.1"

# concurrent collections / sync
dashmap     = "6"
indexmap    = "2"
parking_lot = "0.12"

# misc
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
