[package]
name = "cs-stratum-bridge"
version = "0.1.0"
edition = "2021"
description = "Bridge/adapter between stratum-based cs-miner clients and the csd daemon — owns the OPoI (AI-inference mining) protocol, relays PoW mining.* traffic through to the upstream pool unchanged"

[[bin]]
name = "cs-stratum-bridge"
path = "src/main.rs"

[dependencies]
# async
tokio       = { version = "1", features = ["full"] }
futures     = "0.3"

# CLI + config
clap        = { version = "4", features = ["derive", "env"] }
dotenvy     = "0.15"

# serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# HTTP server (prompt intake + status API)
axum        = "0.7"
tower-http  = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (csd JSON-RPC)
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# database
sqlx        = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "macros", "migrate"] }

# crypto / encoding
sha2        = "0.10"
hex         = "0.4"
# B3-lite (see opoi/b3lite.rs): HMAC-SHA256 signed receipts — a symmetric,
# operator-shared-secret signature. Deliberately not an asymmetric scheme:
# this receipt is an OFF-CHAIN-ONLY accountability artifact for the
# bridge operator's own sampling/audit/consequence pipeline (see the
# B3-lite scope doc — "no consensus change"), not a publicly-verifiable
# on-chain commitment, so there's no third party needing to verify it
# without sharing the secret, and no existing asymmetric-signing key
# management infrastructure in this codebase to build on instead.
hmac        = "0.12"

# F15-L (speculative_engine.rs): the bridge needs to know the prompt's REAL
# token count (to seed `base`, the KV-cache position speculative rounds are
# tracked relative to) without doing any inference itself — same tokenizer
# crate/version cs-miner already uses, downloading the same tokenizer.json
# ModelSource already has a URL/hash for (see gguf_fetch-style caching in
# opoi/speculative_engine.rs).
tokenizers  = "0.22"

# logging
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# error handling
anyhow      = "1"
thiserror   = "1"
async-trait = "0.1"

# concurrent collections / sync
dashmap     = "6"
indexmap    = "2"
parking_lot = "0.12"

# misc
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
